name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast gate: the pure Dart core, where most changes land.
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/botany_core
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test
